name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run test

  unit-windows:
    timeout-minutes: 60
    runs-on: windows-latest
    # Vendored OpenSSL needs Strawberry Perl; under bash, Git's own perl comes first on PATH and lacks modules.
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    # bash -e: Windows defaults to PowerShell, which only reports the last command's exit code.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run --cwd apps/desktop build
      - run: cargo test -p db-desktop --locked

  unit-linux:
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! reads the built frontend at compile time.
      - run: bun run --cwd apps/desktop build
      - run: cargo test -p db-desktop --locked
      - run: cargo clippy -p db-desktop --all-targets --locked -- -D warnings

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo fmt --check
      # db-desktop needs the Linux webview libraries, so its clippy runs in the macOS build job and unit-linux.
      - run: cargo clippy --workspace --exclude db-desktop --all-targets --locked -- -D warnings
      - name: Test the DCO check
        run: bash .github/scripts/check-dco.test.sh

  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG: "1"
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5433"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DB: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed database
        env:
          PGPASSWORD: postgres
        run: |
          for f in docker/postgres/init/*.sql; do
            psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: cargo test -p db-postgres --locked -- --include-ignored

  # Compile check on every platform a contributor might use. Only macOS ships installers today.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung or slow build fails the job instead of spinning until GitHub's 6-hour limit.
    timeout-minutes: 25
    # bash -e on every OS: Windows defaults to PowerShell, which only reports the last command's exit code.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Vendored OpenSSL for ssh2 on Windows is built with NASM and Strawberry Perl; under bash, Git's own perl
      # comes first on PATH and lacks the modules OpenSSL's Configure needs.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Install Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libsecret-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! reads the built frontend at compile time.
      - run: bun run --cwd apps/desktop build
      - run: cargo check -p db-desktop --locked
      - name: Clippy for the desktop crate
        if: runner.os == 'macOS'
        run: cargo clippy -p db-desktop --all-targets --locked -- -D warnings

  # Every commit needs a Signed-off-by line (see CONTRIBUTING.md).
  dco:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
