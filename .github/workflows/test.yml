name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG: "1"
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5433"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed database
        env:
          PGPASSWORD: postgres
        run: |
          for f in docker/postgres/init/*.sql; do
            psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: cargo test -p db-postgres -- --include-ignored
