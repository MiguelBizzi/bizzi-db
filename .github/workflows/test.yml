name: test

on:
  pull_request:
  push:
    branches: [main]
  # Advisories appear against dependencies that have not changed, which the path rules would never notice.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which areas a change touches; the rules live in .github/scripts/changed-areas.sh. The jobs below are
  # skipped rather than left out of the workflow, so the checks branch protection waits for always report.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.areas.outputs.desktop }}
      web: ${{ steps.areas.outputs.web }}
      deps: ${{ steps.areas.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The three-dot diff needs the merge base.
          fetch-depth: 0
      - id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            printf 'desktop=false\nweb=false\ndeps=true\n' >> "$GITHUB_OUTPUT"
            echo "Scheduled run: only the dependency audit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ]; then range="$PR_BASE...$PR_HEAD"; else range="$PUSH_BEFORE...$PUSH_AFTER"; fi
          # A new branch or a force-push leaves no usable "before" commit; then every area runs.
          if git diff --name-only "$range" > "$RUNNER_TEMP/changed.txt"; then
            bash .github/scripts/changed-areas.sh < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT" 2>> "$GITHUB_STEP_SUMMARY"
          else
            bash .github/scripts/changed-areas.sh --all >> "$GITHUB_OUTPUT" 2>> "$GITHUB_STEP_SUMMARY"
          fi

  unit:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun x turbo run test --filter='!web'
      - run: cargo test --workspace --exclude db-desktop --locked

  unit-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 60
    runs-on: windows-latest
    # Vendored OpenSSL needs Strawberry Perl; under bash, Git's own perl comes first on PATH and lacks modules.
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    # bash -e: Windows defaults to PowerShell, which only reports the last command's exit code.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      - run: bun x turbo run test --filter='!web'
      - run: cargo test --workspace --exclude db-desktop --locked
      - run: bun run --cwd apps/desktop build
      - run: cargo test -p db-desktop --locked

  unit-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! reads the built frontend at compile time.
      - run: bun run --cwd apps/desktop build
      - run: cargo test -p db-desktop --locked
      - run: cargo clippy -p db-desktop --all-targets --locked -- -D warnings

  lint:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: bun install --frozen-lockfile
      - run: bun run lint --filter='!web'
      - run: cargo fmt --check
      # db-desktop needs the Linux webview libraries, so its clippy runs in the macOS build job and unit-linux.
      - run: cargo clippy --workspace --exclude db-desktop --all-targets --locked -- -D warnings
      - name: Test the DCO check
        run: bash .github/scripts/check-dco.test.sh
      - name: Test the changed-areas rules
        run: bash .github/scripts/changed-areas.test.sh
      - name: Test the sign-off hook
        run: bash .githooks/prepare-commit-msg.test.sh

  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  integration:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: shop
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      TEST_PG: "1"
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5433"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres
      TEST_PG_DB: postgres
      TEST_MYSQL: "1"
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3307"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: mysql
      TEST_MYSQL_DB: shop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client mysql-client
      - name: Seed PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for f in docker/postgres/init/*.sql; do
            psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Seed MySQL
        run: |
          for f in docker/mysql/init/*.sql; do
            mysql -h 127.0.0.1 -P 3307 -uroot -pmysql --default-character-set=utf8mb4 < "$f"
          done
      - run: cargo test -p db-postgres --locked -- --include-ignored
      - run: cargo test -p db-mysql --locked -- --include-ignored

  # Compile check on every platform a contributor might use. Only macOS ships installers today.
  build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung or slow build fails the job instead of spinning until GitHub's 6-hour limit.
    timeout-minutes: 25
    # bash -e on every OS: Windows defaults to PowerShell, which only reports the last command's exit code.
    defaults:
      run:
        shell: bash
    # The Windows leg is not required to merge (see .github/rulesets/apply.md); continue-on-error keeps its failure
    # from failing ci-required while the check itself still shows red.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Vendored OpenSSL for ssh2 on Windows is built with NASM and Strawberry Perl; under bash, Git's own perl
      # comes first on PATH and lacks the modules OpenSSL's Configure needs.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Install Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libsecret-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! reads the built frontend at compile time.
      - run: bun run --cwd apps/desktop build
      - run: cargo check -p db-desktop --locked
      - name: Clippy for the desktop crate
        if: runner.os == 'macOS'
        run: cargo clippy -p db-desktop --all-targets --locked -- -D warnings

  # Every commit needs a Signed-off-by line (see CONTRIBUTING.md).
  dco:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun x turbo run lint test build --filter=web

  # The one check branch protection requires besides dco. A job skipped because no changed file belongs to it counts
  # as passed; a failed or cancelled one does not. Requiring each job by name would hang on skipped matrix jobs,
  # which GitHub reports under their unexpanded "build (${{ matrix.os }})" name.
  ci-required:
    if: always()
    needs: [changes, unit, lint, audit, integration, build, web]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
