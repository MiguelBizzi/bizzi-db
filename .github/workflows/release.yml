name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A tag pushed twice must not run two builds that race to upload the same release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Bizzi DB ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          includeUpdaterJson: true

      # Hard gate: a release without a valid latest.json strands every installed app.
      - name: Verify updater manifest
        run: bun apps/desktop/scripts/verify-updater-manifest.ts "${{ github.ref_name }}" "${{ github.repository }}"

      # tauri-action styles the DMG through Finder, which stores a background alias that points at this runner's
      # temporary image and never resolves on a user's Mac. brand-dmg.sh rewrites the styling, swaps in the orange
      # Applications folder and re-signs the DMG. Any failure here fails the release so an unstyled DMG cannot ship quietly.
      - name: Install DMG tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install --quiet ds_store==1.3.3 mac_alias==2.2.3

      - name: Brand the DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DMG_PYTHON: ${{ runner.temp }}/dmg-venv/bin/python3
        run: |
          set -euo pipefail
          dmg="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)"
          assets/brand/dmg/brand-dmg.sh "$dmg"
          "$DMG_PYTHON" assets/brand/dmg/verify-dmg.py "$dmg" apps/desktop/src-tauri/tauri.conf.json --require-signature
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber

      # Download what users will actually get and check it again.
      - name: Verify the published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG_PYTHON: ${{ runner.temp }}/dmg-venv/bin/python3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "${{ github.ref_name }}" --pattern "*.dmg" --dir "$RUNNER_TEMP/published" --clobber
          "$DMG_PYTHON" assets/brand/dmg/verify-dmg.py "$RUNNER_TEMP/published/"*.dmg apps/desktop/src-tauri/tauri.conf.json --require-signature
