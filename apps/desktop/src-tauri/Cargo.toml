[package]
name = "db-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "db_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "=2.0.4", features = [] }

[dependencies]
db-core = { path = "../../../crates/core" }
db-postgres = { path = "../../../crates/postgres" }
db-storage = { path = "../../../crates/storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.2.0", features = [] }
tauri-utils = "=2.2.0"
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
url = "=2.5.8"
indexmap = "=2.6.0"
ssh2 = "=0.9.4"
rfd = "=0.14.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.2.0"
tauri-plugin-process = "=2.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
