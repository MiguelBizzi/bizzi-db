[package]
name = "db-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "db_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "=2.0.4", features = [] }

[dependencies]
db-core = { path = "../../../crates/core" }
db-postgres = { path = "../../../crates/postgres" }
db-storage = { path = "../../../crates/storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.2.0", features = [] }
tauri-utils = "=2.2.0"
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
url = "=2.5.8"
indexmap = "=2.14.2"
# Vendored OpenSSL so the universal macOS build can cross-compile
# x86_64 without a second system OpenSSL.
ssh2 = { version = "=0.9.6", features = ["vendored-openssl"] }
rfd = "0.15"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.2.0"
tauri-plugin-process = "=2.2.0"
tauri-plugin-opener = "=2.3.1"

[target.'cfg(windows)'.dependencies]
# macOS and Linux link the system/vendored OpenSSL without these features;
# Windows needs OpenSSL for ed25519 host keys that the WinCNG backend lacks.
ssh2 = { version = "=0.9.4", features = ["vendored-openssl", "openssl-on-win32"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.2.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
