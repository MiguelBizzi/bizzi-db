[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/postgres",
  "crates/storage",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.19"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", features = ["serde"] }
deadpool-postgres = "=0.14.2"
keyring = "=3.6.3"
native-tls = "=0.2.18"
postgres-native-tls = "=0.5.3"
postgres-protocol = "=0.6.12"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.20"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-postgres = { version = "=0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
