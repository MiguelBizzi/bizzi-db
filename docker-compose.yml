name: db-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: db-manager-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: db-manager-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: shop
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  mssql:
    build:
      context: ./docker/mssql
    image: db-manager-mssql:2022
    platform: linux/amd64
    container_name: db-manager-mssql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1434}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Mssql_dev_1
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/opt/mssql/.seeded && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -l 2 -b -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s

volumes:
  postgres-data:
  mysql-data:
  mssql-data:
